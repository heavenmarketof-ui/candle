<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Acesso administrativo · Candle</title><link rel="icon" href="/assets/favicon-candle.png"><link rel="stylesheet" href="/admin/admin.css"><style>
*{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 80% 15%,#292117 0,transparent 42%),#101418;color:#F6F0E6;font-family:'DM Sans',sans-serif}.auth{width:min(100%,460px);padding:42px;background:#171c20;border:1px solid #66583e}.brand{display:block;margin-bottom:38px}.brand img{width:180px;height:auto;object-fit:contain}.eyebrow{font-size:10px;letter-spacing:.2em;color:#D9B779;font-weight:700}.auth h1{font:700 38px/1.1 Manrope,sans-serif;letter-spacing:-.05em;margin:12px 0}.auth p{color:#c7c0b5;line-height:1.55}.auth label{display:block;margin:18px 0 6px;font-size:13px;color:#D9B779}.auth input{display:block;width:100%;padding:14px 15px;background:#101418;color:#F6F0E6;border:1px solid #625d53;font:inherit}.auth button{width:100%;margin-top:22px;padding:14px;background:#D9B779;color:#101418;border:0;font:700 14px 'DM Sans',sans-serif;cursor:pointer}.auth button:disabled{opacity:.6;cursor:wait}.status{min-height:24px;margin-top:16px;color:#D9B779;font-size:13px}.auth[hidden]{display:none!important}@media(max-width:520px){.auth{padding:30px 24px}}
</style><script defer src="/admin/login/login.js"></script></head><body><main class="auth"><a class="brand" href="/"><img src="/assets/logo-candle.png" alt="Candle Marketing & Strategy"></a><p class="eyebrow">ÁREA RESTRITA / CANDLE</p><section id="login"><h1>Acesse o painel.</h1><p>Entre com seu usuário e senha administrativos.</p><form id="login-form"><label for="username">Usuário</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">Senha</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">Entrar no painel ↗</button></form></section><section id="setup" hidden><h1>Configure seu acesso.</h1><p>Este primeiro cadastro é permitido somente enquanto sua sessão atual da Cloudflare estiver autenticada.</p><form id="setup-form"><label for="new-username">Crie seu usuário</label><input id="new-username" name="username" autocomplete="username" minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9._-]{2,39}" required><label for="new-password">Crie sua senha</label><input id="new-password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="200" required><button type="submit">Salvar acesso e continuar ↗</button></form></section><p id="status" class="status" role="status" aria-live="polite"></p></main></body></html>
