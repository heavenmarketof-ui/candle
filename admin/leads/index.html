<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Candle Admin · Leads</title><link rel="stylesheet" href="/admin/admin.css"><style>main{max-width:1150px;margin:auto;padding:30px}input{padding:13px;background:#222;color:white;border:1px solid #777;width:100%;max-width:450px}.leadcard{padding:22px;border:1px solid #555;margin:14px 0;border-radius:12px;background:#202326}.leadcard h3{margin:0}.muted{color:#bcbcbc}details{margin-top:15px}summary{cursor:pointer;color:#d9b779}dl{display:grid;grid-template-columns:minmax(130px,1fr) 3fr;gap:12px}dt{font-weight:700}dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}a{color:#d9b779}@media(max-width:600px){dl{grid-template-columns:1fr}dd{margin-bottom:10px}}</style></head><body><header><a href="/admin/">← Candle Admin</a><span>LEADS / DIAGNÓSTICOS</span><a href="/admin/crm/">CRM ↗</a></header><main><p class="eyebrow">CANDLE / RELACIONAMENTO</p><h2>Pessoas e seus <em>diagnósticos.</em></h2><p class="lead">Cadastros vinculados ao WhatsApp. Cada diagnóstico permanece no registro comercial do lead.</p><input id="filter" placeholder="Buscar nome, empresa ou WhatsApp" aria-label="Buscar leads"><p id="status" role="status">Carregando leads...</p><div id="items"></div></main><script>const out=document.querySelector('#items'),status=document.querySelector('#status'),filter=document.querySelector('#filter');let leads=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));const titles=['Equipe e estrutura','Capacidade de festas por fim de semana','Serviços oferecidos','Festas fechadas por mês','Ticket médio','Orçamentos recebidos por mês','Motivos de não fechamento','Acompanhamento de orçamentos','Investimento em anúncios','Origem dos clientes','Produção de conteúdo','Cidades atendidas','Meta de festas','Meta de faturamento','Principal prioridade'];function parse(s){try{return JSON.parse(s)}catch{return null}}function render(){const q=filter.value.toLowerCase().trim();const rows=leads.filter(l=>[l.name,l.company,l.phone].join(' ').toLowerCase().includes(q));out.innerHTML=rows.map(l=>{const d=parse(l.challenge),a=d?.kind==='decoradoras'?d.answers:null;const answers=a?'<dl>'+[['Cidade',a.city],['Instagram',a.instagram],['Site',a.site],...titles.map((t,i)=>[(i+1)+'. '+t,a['q'+(i+1)]]),['Maior dificuldade',a.biggest_challenge]].map(([k,v])=>'<dt>'+esc(k)+'</dt><dd>'+esc(v||'Não informado')+'</dd>').join('')+'</dl>':'<p>'+esc(l.challenge||'Sem respostas')+'</p>';return '<article class="leadcard"><h3>'+esc(l.company)+'</h3><p class="muted">'+esc(l.name)+' · '+esc(l.phone)+' · '+esc(l.created_at||'')+'</p><p>Status: '+esc(l.stage)+' · '+esc(a?'Diagnóstico de decoradoras':l.service)+'</p><a target="_blank" rel="noopener noreferrer" href="https://wa.me/'+String(l.phone||'').replace(/\D/g,'')+'">Abrir WhatsApp ↗</a><details><summary>Ver diagnóstico e histórico de respostas</summary>'+answers+'</details></article>'}).join('')||'<p>Nenhum lead encontrado.</p>';status.textContent=rows.length+' lead(s) encontrado(s).'}filter.addEventListener('input',render);fetch('/api/admin/pipeline',{credentials:'same-origin'}).then(async r=>{if(!r.ok)throw Error('Acesso indisponível ('+r.status+'). Verifique a autenticação e o banco D1.');return r.json()}).then(d=>{leads=d.items||[];render()}).catch(e=>status.textContent=e.message);</script></body></html>
