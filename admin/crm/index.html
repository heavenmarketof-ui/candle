<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Candle Admin · CRM</title><link rel="icon" href="/assets/favicon-candle.png"><link rel="stylesheet" href="/admin/admin.css"><script defer src="/admin/crm/crm.js"></script><style>.pipeline{display:grid;grid-template-columns:repeat(3,minmax(230px,1fr));gap:12px;margin-top:35px}.lane{background:#1d2327;padding:15px;min-height:160px}.lane h3{font:700 17px Manrope,sans-serif;color:#D9B779}.lane article{background:#30363b;padding:15px;margin:10px 0}.lane article p{font-size:12px;color:#ccc}.lane article a,.lane article button{display:inline-block;margin:8px 5px 8px 0;color:#D9B779;background:none;border:0;cursor:pointer;font-size:12px}.lane select{display:block;width:100%;padding:8px;background:#101418;color:#fff;border:1px solid #777}@media(max-width:900px){.pipeline{grid-template-columns:1fr}} .lead-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0 26px;padding:22px;border:1px solid #62533a;background:#171c20}.lead-form label{display:flex;flex-direction:column;gap:6px;color:#D9B779;font-size:13px}.lead-form input,.lead-form select,.lead-form textarea{width:100%;padding:12px;background:#101418;color:#f6f0e6;border:1px solid #6c6c6c;font:inherit}.lead-form .wide{grid-column:1/-1}.lead-form button{background:#D9B779;color:#101418;border:0;padding:13px 20px;font-weight:700;cursor:pointer}.lead-form button:disabled{opacity:.5}.lead-form[hidden]{display:none}@media(max-width:650px){.lead-form{grid-template-columns:1fr}}</style></head><body><header><a href="/admin/">← Central de Gestão</a><span>CANDLE / CRM</span><a href="/admin/contratos/">Candle Sign ↗</a></header><main><p class="eyebrow">CRM COMERCIAL</p><h2>Relacionamentos<br><em>em movimento.</em></h2><p class="lead">Funil previsto: novo lead → contato → diagnóstico → proposta → negociação → ganho ou perdido.</p><button id="toggle-lead" type="button" style="padding:14px 22px;background:#D9B779;color:#101418;border:0;font-weight:700;cursor:pointer">+ Cadastrar lead</button><form id="lead-form" class="lead-form" hidden><label>Nome do contato<input name="name" maxlength="120" required autocomplete="name"></label><label>Empresa / negócio<input name="company" maxlength="150" required></label><label>WhatsApp / telefone<input name="phone" maxlength="25" required placeholder="11999999999"></label><label>Serviço de interesse<input name="service" maxlength="80" required placeholder="Ex.: Consultoria estratégica"></label><label class="wide">Observações iniciais<textarea name="challenge" rows="3" maxlength="1200"></textarea></label><div class="wide"><button type="submit">Salvar lead</button> <button type="button" id="cancel-lead" style="background:transparent;color:#D9B779;border:1px solid #D9B779">Cancelar</button></div></form><p id="message" role="status">Carregando...</p><div id="board" class="pipeline"></div><div class="cards"><a href="/admin/"><span>VOLTAR</span><h3>Central administrativa ↗</h3></a><a href="/admin/contratos/"><span>PRÓXIMA ETAPA</span><h3>Candle Sign ↗</h3></a></div></main><script defer src="/admin/session.js"></script></body></html>
